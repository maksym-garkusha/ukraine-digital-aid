name: site

# Щопонеділка забирає свіжі записи з d-portal і перезбирає сторінку, стрічки змін і звіт.
# Кеш активностей переживає запуски, тому повні записи качаються тільки для нових і змінених.
# У тому ж кеші лежать зрізи переліку за останні 35 днів, з них рахується блок «Що змінилося».
# Якщо d-portal недоступний або зібрано менше половини від минулого разу, fetch падає,
# кеш не зберігається, і на Pages лишається попередня сторінка.
on:
  schedule:
    - cron: '41 4 * * 1'
  push:
    branches: [main]
    paths: ['src/**', 'site/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      # ключ щоразу новий, а restore-keys підтягує найсвіжіший попередній кеш
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cache
          key: activities-${{ github.run_id }}
          restore-keys: activities-
      # серед тестів є звірка хешів CSP: зі старим хешем сторінка не запустила б свій скрипт
      - name: Test
        run: dotnet test
      - name: Fetch activities from d-portal
        run: dotnet run -c Release --project src/UkraineDigitalAid -- fetch
      # зріз з опублікованої сторінки потрібен, лише якщо кеш зник: тоді export порівнює з ним,
      # інакше блок змін тиждень був би порожній. Першого разу файлу ще немає, і це не помилка
      - name: Download the published snapshot
        run: >-
          curl -fsS --max-time 60 --max-filesize 5242880 -o published-snapshot.json
          https://maksym-garkusha.github.io/ukraine-digital-aid/snapshot.json
          || echo "Опублікованого зрізу немає"
      - name: Export data for the page
        run: dotnet run -c Release --no-build --project src/UkraineDigitalAid -- export site --previous published-snapshot.json
      - name: Build report
        run: dotnet run -c Release --no-build --project src/UkraineDigitalAid -- report site/report.md
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # права на публікацію потрібні тільки цьому кроку, збірка їх не має
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
